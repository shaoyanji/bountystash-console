<!DOCTYPE html>
<html lang="en" data-theme="dark" data-view="3d">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message sent — Matt Ji</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231F69FF'/%3E%3Ctext y='.9em' font-size='80' font-family='monospace' font-weight='bold' fill='white'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script>
  (function(){
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
      document.documentElement.setAttribute('data-view', localStorage.getItem('viewMode') || '3d');
    } catch(e){}
  })();
</script>
</head>
<body>

  <header class="spatial-hud-top">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span class="status-dot"></span>
      <strong>MATT JI</strong>
      <span class="muted">// SENT</span>
    </div>
    <div style="color: var(--accent-bright); font-weight: 700;">[ TRANSMISSION: RECEIVED ]</div>
    <div style="display: flex; align-items: center; gap: 0.35rem;">
      <a href="/" class="hud-control-btn" style="text-decoration: none;">[ &larr; CONSOLE ]</a>
    </div>
  </header>

  <div id="workspaceContainer">
    <div id="spatialViewport">
      <div id="cameraWorld">
        <section class="sector-plane plane-active" id="sector0">
          <div class="sector-tag">
            <span>// SECTOR 05 : DISPATCH</span>
            <span class="mono">STATUS: QUEUED</span>
          </div>
          <h1 style="margin: 0.5rem 0;">Message sent</h1>
          <p class="lead" style="margin-bottom: 1rem;">It is on its way to {{EMAIL}}. A reply comes from that address, usually within a day.</p>
          <a href="/" class="btn btn-primary">Back to the console</a>
        </section>
      </div>
    </div>
  </div>

  <footer class="spatial-hud-bottom">
    <span class="mono">[ SEC.05 / 05 : DISPATCH ]</span>
    <span class="mono">END OF TRANSMISSION</span>
    <span class="mono"><a href="/contact/" style="text-decoration: none;">[ NEW MESSAGE ]</a></span>
  </footer>
</body>
</html>
